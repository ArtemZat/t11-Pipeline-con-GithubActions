name: CI Pipeline

on:
  push:
    branches:
      - main  # Activa el pipeline cuando haya un push en la rama 'main'
  pull_request:
    branches:
      - main  # Activa el pipeline cuando se crea un PR hacia la rama 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm install cypress --save-dev  # Instala cypress
    
      - name: Run tests
        run: npx cypress run  # Ejecuta los tests
